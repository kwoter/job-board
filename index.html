<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Jobs Board</title>
  <meta name="description" content="Personal job board">
  <meta name="theme-color" content="#070B17">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Jobs">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="bg" aria-hidden="true">
    <div class="aurora aurora-a"></div>
    <div class="aurora aurora-b"></div>
    <div class="aurora aurora-c"></div>
    <div class="dots"></div>
    <div class="vignette"></div>
    <div class="grain"></div>
  </div>

  <!-- Lock screen -->
  <div id="lock" class="lock">
    <div class="lock-inner">
      <div class="splash-mark lock-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
      </div>
      <p class="lock-title">Enter your PIN</p>
      <div class="pin-dots" id="pin-dots" aria-label="PIN entry">
        <span class="pin-dot"></span><span class="pin-dot"></span><span class="pin-dot"></span><span class="pin-dot"></span>
      </div>
      <p id="lock-msg" class="lock-msg" role="alert"></p>
      <div class="numpad" id="numpad">
        <button data-key="1">1</button>
        <button data-key="2">2</button>
        <button data-key="3">3</button>
        <button data-key="4">4</button>
        <button data-key="5">5</button>
        <button data-key="6">6</button>
        <button data-key="7">7</button>
        <button data-key="8">8</button>
        <button data-key="9">9</button>
        <button data-key="bio" id="bio-key" class="numpad-soft is-ghost" aria-label="Unlock with Face ID">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3H5a2 2 0 0 0-2 2v2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M17 21h2a2 2 0 0 0 2-2v-2"/><path d="M8 10h.01"/><path d="M16 10h.01"/><path d="M9 15.5a4 4 0 0 0 6 0"/></svg>
        </button>
        <button data-key="0">0</button>
        <button data-key="back" class="numpad-soft" aria-label="Delete digit">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"/><line x1="18" y1="9" x2="12" y2="15"/><line x1="12" y1="9" x2="18" y2="15"/></svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Face ID enrol prompt -->
  <div id="bio-prompt" class="bio-prompt" hidden>
    <div class="bio-prompt-text">
      <strong>Unlock with Face ID?</strong>
      <span>Skip the PIN on this device.</span>
    </div>
    <div class="bio-prompt-actions">
      <button id="bio-enable" class="btn-primary">Enable</button>
      <button id="bio-dismiss" class="icon-btn" aria-label="Not now">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
  </div>

  <!-- Board -->
  <div id="app-view" class="view app-view" hidden>
    <header class="app-header">
      <div class="header-title">
        <h1 class="wordmark">Jobs<span class="wordmark-dot">.</span></h1>
      </div>
      <div class="header-actions">
        <button id="add-desktop" class="btn-primary btn-add-desktop">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          New job
        </button>
        <button id="bell-btn" class="icon-btn" aria-label="Notifications" aria-pressed="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          <span class="bell-dot" aria-hidden="true"></span>
        </button>
      </div>
    </header>

    <section class="hero">
      <div class="hero-text">
        <h2 class="hero-greeting" id="hero-greeting"></h2>
        <p class="hero-date" id="hero-date"></p>
      </div>
      <div class="ring" id="ring" hidden>
        <svg viewBox="0 0 64 64" aria-hidden="true">
          <defs>
            <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#4D8DFF"/>
              <stop offset="1" stop-color="#34D399"/>
            </linearGradient>
          </defs>
          <circle class="ring-track" cx="32" cy="32" r="27"/>
          <circle class="ring-fill" id="ring-fill" cx="32" cy="32" r="27"/>
        </svg>
        <div class="ring-center">
          <span id="ring-num">0/0</span>
          <small>today</small>
        </div>
      </div>
    </section>

    <div class="stats" id="stats" aria-live="polite"></div>

    <section id="upnext" class="upnext" hidden></section>

    <nav class="tabs" id="tabs" aria-label="Board columns">
      <span class="tab-indicator" id="tab-indicator" aria-hidden="true"></span>
      <button class="tab is-active" data-status="todo"><span class="status-dot dot-todo"></span>To Do<span class="count" data-count="todo">0</span></button>
      <button class="tab" data-status="doing"><span class="status-dot dot-doing"></span>Doing<span class="count" data-count="doing">0</span></button>
      <button class="tab" data-status="done"><span class="status-dot dot-done"></span>Done<span class="count" data-count="done">0</span></button>
    </nav>

    <section class="board" id="board">
      <div class="column" data-status="todo">
        <header class="column-head">
          <span class="status-dot dot-todo"></span>
          <h2>To Do</h2><span class="count" data-count="todo">0</span>
        </header>
        <div class="cards" data-col="todo"></div>
        <div class="empty" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1"/></svg>
          <p>Nothing queued.</p>
        </div>
      </div>
      <div class="column" data-status="doing">
        <header class="column-head">
          <span class="status-dot dot-doing"></span>
          <h2>Doing</h2><span class="count" data-count="doing">0</span>
        </header>
        <div class="cards" data-col="doing"></div>
        <div class="empty" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15 14"/></svg>
          <p>Nothing on the go.</p>
        </div>
      </div>
      <div class="column" data-status="done">
        <header class="column-head">
          <span class="status-dot dot-done"></span>
          <h2>Done</h2><span class="count" data-count="done">0</span>
        </header>
        <div class="cards" data-col="done"></div>
        <div class="empty" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
          <p>Nothing finished yet.</p>
        </div>
      </div>
    </section>

    <button id="fab" class="fab" aria-label="Add job">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </button>
  </div>

  <!-- Add / edit sheet -->
  <div id="sheet-backdrop" class="sheet-backdrop" hidden></div>
  <div id="sheet" class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
    <div class="sheet-handle" aria-hidden="true"></div>
    <div class="sheet-head">
      <h2 id="sheet-title">New job</h2>
      <button id="sheet-close" class="icon-btn" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <form id="job-form" novalidate>
      <label class="field">
        <span class="field-label">Job</span>
        <input id="f-title" type="text" placeholder="What needs doing?" autocomplete="off" required>
      </label>
      <label class="field">
        <span class="field-label">Client or project <em>(optional)</em></span>
        <input id="f-client" type="text" autocomplete="off">
      </label>
      <label class="field">
        <span class="field-label">Notes <em>(optional)</em></span>
        <textarea id="f-notes" rows="3"></textarea>
      </label>
      <div class="field-row">
        <label class="field">
          <span class="field-label">Due</span>
          <input id="f-due" type="datetime-local">
        </label>
        <label class="field">
          <span class="field-label">Remind me</span>
          <select id="f-remind" disabled>
            <option value="">No reminder</option>
            <option value="0">At due time</option>
            <option value="15">15 min before</option>
            <option value="60">1 hour before</option>
            <option value="1440">1 day before</option>
          </select>
        </label>
      </div>
      <div class="field">
        <span class="field-label">Priority</span>
        <div class="segmented" id="f-priority" role="radiogroup" aria-label="Priority">
          <button type="button" data-value="low">Low</button>
          <button type="button" data-value="normal" class="is-active">Normal</button>
          <button type="button" data-value="high">High</button>
        </div>
      </div>
      <div class="field">
        <span class="field-label">Status</span>
        <div class="segmented" id="f-status" role="radiogroup" aria-label="Status">
          <button type="button" data-value="todo" class="is-active">To Do</button>
          <button type="button" data-value="doing">Doing</button>
          <button type="button" data-value="done">Done</button>
        </div>
      </div>
      <button id="save-btn" class="btn-primary btn-block" type="submit">
        <span class="btn-label">Save job</span>
        <span class="spinner" aria-hidden="true"></span>
      </button>
      <button id="delete-btn" class="btn-danger" type="button" hidden>Delete job</button>
    </form>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script type="module" src="app.js"></script>
</body>
</html>
